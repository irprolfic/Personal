<style>
  :root {
    color-scheme: dark;
    --bg: #080d19;
    --surface: #121c30;
    --text: #f2f5fc;
    --muted: #b0bdd2;
    --line: #2b3953;
    --accent: #79efc0;
    --soft: #122d2c;
    --purple: #281f49;
  }

  body {
    background:
      radial-gradient(ellipse at 8% 0%, #153e354d, transparent 40%),
      radial-gradient(ellipse at 95% 18%, #54329438, transparent 38%),
      var(--bg);
  }

  header {
    background: #0c1323;
    border-bottom: 1px solid var(--line);
  }

  .brand {
    color: #ffffff;
    letter-spacing: -.5px;
  }

  .brand span { color: var(--accent); }

  .nav-links a {
    color: #d4ddef;
    transition: color .2s ease;
  }

  .nav-links a:hover,
  .toc a:hover {
    color: var(--accent);
  }

  .hero {
    position: relative;
    padding-top: 95px;
    padding-bottom: 72px;
  }

  .eyebrow {
    color: var(--accent);
    letter-spacing: 2.5px;
  }

  h1 {
    color: #f5f7ff;
    letter-spacing: -.055em;
  }

  @supports (background-clip: text) or (-webkit-background-clip: text) {
    .hero h1,
    .case-hero h1 {
      background: linear-gradient(
        115deg,
        #ffffff 10%,
        #dce6ff 48%,
        #91edcc 95%
      );
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
  }

  h2, h3 { color: #f4f7ff; }

  .lead {
    color: #bac6da;
    line-height: 1.8;
  }

  .tag {
    background: #142238;
    border: 1px solid #354761;
    color: #d3def0;
    padding: 7px 14px;
  }

  .hero .tag:nth-child(2) {
    background: #252040;
    border-color: #564779;
    color: #e0d2ff;
  }

  .hero .tag:nth-child(3) {
    background: #14302e;
    border-color: #326456;
    color: #a5f1d3;
  }

  .section-heading {
    margin-bottom: 14px;
  }

  .section-heading h2::before {
    content: "";
    display: inline-block;
    width: 9px;
    height: 28px;
    margin-right: 14px;
    border-radius: 4px;
    background: var(--accent);
    vertical-align: -2px;
  }

  .project {
    background: linear-gradient(145deg, #152137, #10182a);
    border: 1px solid #33435d;
    box-shadow: 0 18px 45px #00000030;
    transition:
      transform .25s ease,
      border-color .25s ease,
      box-shadow .25s ease;
  }

  .project:focus-within {
    border-color: var(--accent);
  }

  .project-art {
    position: relative;
    isolation: isolate;
    overflow: hidden;
    min-height: 275px;
    background:
      radial-gradient(circle at 20% 20%, #48deaa35, transparent 55%),
      linear-gradient(135deg, #113c37, #122731);
    border-bottom: 1px solid #35514f;
  }

  .project-art.purple {
    background:
      radial-gradient(circle at 80% 15%, #a270ef45, transparent 55%),
      linear-gradient(135deg, #342250, #1d2242);
    border-bottom-color: #51416a;
  }

  /* Decorative rings behind the concept cards */
  .project-art::before,
  .project-art::after {
    content: "";
    position: absolute;
    z-index: -1;
    width: 270px;
    height: 270px;
    border: 1px solid #ffffff14;
    border-radius: 50%;
    pointer-events: none;
  }

  .project-art::before {
    top: -130px;
    right: -50px;
  }

  .project-art::after {
    bottom: -180px;
    left: -40px;
    width: 340px;
    height: 340px;
  }

  .mini-ui {
    background: linear-gradient(145deg, #172b32, #0d1926);
    color: #effff9;
    border: 1px solid #4a8276;
    border-radius: 18px;
    padding: 27px;
    box-shadow: 0 20px 45px #00000045;
  }

  .mini-ui strong {
    margin-top: 12px;
    color: #f5fffc;
    font-size: 23px;
    line-height: 1.35;
  }

  .mini-ui p { color: #bfdbd4; }

  .mini-row {
    color: #a9c8c0;
    border-color: #34504f;
  }

  .purple .mini-ui {
    background: linear-gradient(145deg, #302647, #181b30);
    border-color: #8061ab;
  }

  .purple .mini-ui .eyebrow { color: #d1b5ff; }
  .purple .mini-ui p { color: #d7c9ed; }

  .purple .mini-row {
    color: #c1b1d8;
    border-color: #514264;
  }

  .project-body { padding: 32px; }
  .project-body p { color: #b8c5da; }
  .project:nth-child(2) .project-body .eyebrow { color: #c9a8ff; }

  .button {
    background: #79efc0;
    border-color: #79efc0;
    color: #092319;
    padding: 12px 20px;
    font-weight: 750;
    box-shadow: 0 5px 18px #79efc014;
    transition: background .2s ease, box-shadow .2s ease;
  }

  .button:hover {
    background: #a1ffdb;
    border-color: #a1ffdb;
    color: #092319;
    box-shadow: 0 5px 24px #79efc02b;
  }

  .project:nth-child(2) .button {
    background: #c6a5ff;
    border-color: #c6a5ff;
    color: #211137;
  }

  .project:nth-child(2) .button:hover {
    background: #dcc7ff;
    border-color: #dcc7ff;
  }

  .about {
    max-width: none;
    padding: 36px;
    background: linear-gradient(120deg, #152a30, #171c32);
    border: 1px solid #344955;
    border-radius: var(--radius);
  }

  .about p { max-width: 800px; }

  /* Case-study pages */
  .back { color: #a2eecf; }

  .meta {
    padding: 25px;
    background: #111c2f;
    border: 1px solid #32415b;
    border-radius: 14px;
  }

  .meta strong { color: #f3f6ff; }
  .meta span { color: #bac6da; }

  .toc {
    padding-left: 18px;
    border-left: 2px solid #354760;
  }

  .toc a { color: #b7c4da; }

  .callout {
    background: linear-gradient(115deg, #14382f, #132731);
    border-left-color: #79efc0;
  }

  .callout p { color: #e2faef; }

  .insight {
    background: linear-gradient(125deg, #172339, #111b2d);
    border-color: #32435e;
  }

  .insight h3 { color: #d8f9ea; }

  th {
    background: #1b2f40;
    color: #ebf5ff;
  }

  td { color: #bac6da; }

  tbody tr:nth-child(even) {
    background: #ffffff03;
  }

  details {
    padding: 20px 0;
    border-color: #32415b;
  }

  summary { color: #e6edf9; }
  details[open] summary { color: var(--accent); }

  .next {
    background:
      radial-gradient(ellipse at right, #694aa044, transparent 65%),
      linear-gradient(120deg, #193a35, #232a45);
    border: 1px solid #476072;
  }

  .next a {
    display: inline-block;
    margin-top: 8px;
    font-size: 21px;
    font-weight: 650;
    color: #f4f8ff;
  }

  footer {
    background: #080d18;
    color: #aab9d0;
  }

  .skip {
    background: #79efc0;
    color: #092319;
  }

  a:focus-visible,
  button:focus-visible,
  summary:focus-visible {
    outline-color: #ffcf80;
  }

  @media (hover: hover) and (prefers-reduced-motion: no-preference) {
    .project:hover {
      transform: translateY(-6px);
      border-color: #70c9a7;
      box-shadow: 0 24px 55px #00000045;
    }

    .project:nth-child(2):hover {
      border-color: #b391eb;
    }
  }

  @media (max-width: 760px) {
    .hero { padding-top: 55px; padding-bottom: 42px; }
    .project-art { min-height: 245px; }
    .project-body, .about { padding: 25px; }
    .toc { padding-left: 0; border-left: 0; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition: none !important; }
  }

  @media print {
    :root {
      color-scheme: light;
      --text: #182721;
      --muted: #435048;
      --line: #cccccc;
      --accent: #205b42;
    }

    body,
    .meta,
    .insight,
    .callout,
    .about,
    th,
    td {
      background: white !important;
      box-shadow: none !important;
      color: #182721 !important;
    }

    h1, h2, h3, p, span, strong, summary, a,
    .case-hero h1, .hero h1 {
      background: none !important;
      color: #182721 !important;
      -webkit-text-fill-color: #182721 !important;
    }
  }
</style>
